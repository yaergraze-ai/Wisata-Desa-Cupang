services:
  postgres:
    image: postgres:16-alpine
    container_name: wisata-cirebon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wisata
      POSTGRES_PASSWORD: wisata_local_password
      POSTGRES_DB: wisata_cirebon
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - wisata_cirebon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisata -d wisata_cirebon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wisata_cirebon_pgdata:
